<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Bakery POS</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Campus Bakery POS</h1>
  </header>

  <main class="pos-layout">
    <section aria-labelledby="products-heading">
      <h2 id="products-heading">Product List</h2>
      <div id="product-list">
        <p class="placeholder">Products will appear here.</p>
      </div>
    </section>

    <section aria-labelledby="cart-heading">
      <h2 id="cart-heading">Cart / Order Summary</h2>
      <div id="cart-items">
        <p class="placeholder">The cart is empty.</p>
      </div>
      <p class="total" aria-live="polite">Total: <span id="order-total">₱0.00</span></p>
    </section>

    <section aria-labelledby="payment-heading">
      <h2 id="payment-heading">Payment Section</h2>
      <form id="payment-controls" novalidate>
        <label for="cash-amount">Cash amount (₱)</label>
        <input id="cash-amount" name="cash" type="number" min="0" step="0.01">
        <button type="submit">Confirm Payment</button>
      </form>
      <p id="payment-message" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="receipt-heading">
      <h2 id="receipt-heading">Receipt Section</h2>
      <div id="receipt">
        <p class="placeholder">The receipt will appear here.</p>
      </div>
      <button id="new-transaction" type="button">New Transaction</button>
    </section>
  </main>
</body>
</html>
